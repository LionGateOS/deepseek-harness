              - GPU-009aea9f-1bb8-d43b-b56a-abe166f629b0
            gpuMode: single
            launchArgs: []
            label: Laguna XS 2.1 Q4_K_M — RTX 3090 Ti
            notes: "Preferred launch target — first choice. Supervised first launch recommended."
